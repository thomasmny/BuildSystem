messages:
  spawn-teleport-message: true
  join-quit-messages: false
  date-format: yyyy-MM-dd
settings:
  update-checker: false
  scoreboard: false
  archive:
    vanish: true
    change-gamemode: true
    # Options: "SURVIVAL", "CREATIVE", "ADVENTURE", "SPECTATOR"
    world-gamemode: ADVENTURE
  disabled-physics:
    prevent-connections: true
    prevent-fluid-flow: false
    prevent-falling-blocks: true
  save-from-death:
    enabled: true
    teleport-to-map-spawn: true
  build-mode:
    drop-items: true
    move-items: true
  builder:
    block-worldedit-non-builder: true
  navigator:
    item: COMPASS
    give-item-on-join: true
world:
  default:
    permission:
      public: '-'
      private: worlds.%world%
    time:
      sunrise: 0
      noon: 5000
      night: 18000
    worldborder:
      size: 5000
    difficulty: EASY
    gamerules:
      doDaylightCycle: false
      doMobSpawning: false
      doFireTick: false
    settings:
      physics: true
      explosions: false
      mob-ai: true
      block-breaking: true
      block-placement: true
      block-interactions: true
      builders-enabled:
        public: true
        private: true
  lock-weather: false
  invalid-characters: ^\b$
  import-all:
    delay: 10 # In seconds
  max-amount:
    public: -1
    private: 3
  unload:
    enabled: true
    time-until-unload: 00:30:00
    blacklisted-worlds:
    - world
    - world_nether
    - worth_the_end
  deletion-blacklist:
  - world
  - world_nether
  - worth_the_end
  disabled-physics:
    prevent-connections: true
    prevent-fluid-flow: true
    prevent-falling-blocks: true
  backup:
    max-backups-per-world: 7 # Maximum: 18
    auto-backup:
      enabled: true
      interval: 900 # In seconds
      only-active-worlds: true
    storage:
      # Options: local, s3, sftp
      type: local
      s3:
        access-key: YOUR_ACCESS_KEY
        secret-key: YOUR_SECRET_KEY
        region: eu-central-1
        bucket: buildsystem-backups
        path: backups/worlds/
      sftp:
        host: backup.example.org
        port: 2222
        username: YOUR_SFTP_USERNAME
        password: YOUR_SFTP_PASSWORD
        path: backups/worlds/
folder:
  override-permissions: false
  override-projects: false
# Internal, do not change manually!
version: 2
