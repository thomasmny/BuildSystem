storage:
  s3:
    # Can also be supplied as AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY environment
    # variables, which take precedence and keep the secrets out of this file.
    access-key: YOUR_ACCESS_KEY
    secret-key: YOUR_SECRET_KEY
    region: eu-central-1
    bucket: buildsystem-backups
  sftp:
    host: YOUR_SFTP_HOST
    port: 22
    username: YOUR_SFTP_USERNAME
    # Can also be supplied as the BUILDSYSTEM_SFTP_PASSWORD environment variable,
    # which takes precedence and keeps the secret out of this file.
    password: YOUR_SFTP_PASSWORD
world:
  lock-weather: true
  invalid-characters: ^\b$
  import-all-delay: 30
  void-block:
    enabled: true
    material: GOLD_BLOCK
  download:
    enabled: false
    # Where a prepared archive is served from.
    # "local" uses the port below.
    # "s3" uploads it to the bucket under the root "storage" section and hands
    # out an expiring pre-signed link instead, so no port has to be opened and
    # no limit applies to world size. Backups need not be on S3 for this.
    storage: local
    # The port the built-in server listens on, and the address players are sent
    # to. Change the url if the port is reached through a proxy or a domain,
    # e.g. "https://downloads.example.com". Both are ignored when storage is s3.
    port: 8080
    url: http://localhost:8080
    # Enable only when the port is reachable solely through a reverse proxy.
    # Links are then pinned and rate limited per player rather than per proxy,
    # using X-Forwarded-For. Leave it false if the port is reachable directly:
    # anyone could otherwise send that header and claim any address.
    behind-proxy: false
    expiration-minutes: 30
    # Largest single export, and the budget shared by all live downloads. Only
    # apply to local storage, where every archive sits on this server's disk.
    max-size-mb: 2048
    max-storage-mb: 8192
    max-concurrent-downloads: 3
  defaults:
    permission:
      public: '-'
      private: worlds.%world%
    time:
      sunrise: 0
      noon: 6000
      night: 18000
    worldborder-size: 6000000
    builders-enabled:
      public: false
      private: true
    physics: true
    explosions: true
    mob-ai: true
    block-breaking: true
    block-placement: true
    block-interactions: true
    gamerules:
      advance_time: false
      spawn_mobs: false
      fire_damage: false
    difficulty: EASY
    physics-exceptions:
      block-updates: false
      connections: false
      falling-blocks: false
      fluid-flow: false
      growth: false
      spreading: false
      block-forming: false
      block-fading: false
      leaf-decay: true
  backup:
    auto-backup:
      enabled: true
      interval: 900
      only-active-worlds: true
    path: backups/worlds/
    # Where backups are written: local, s3 or sftp.
    # Credentials live under storage.
    storage: local
    max-backups-per-world: 3
  limits:
    private: -1
    public: 5
  deletion-blacklist:
  - world
  - world_nether
  - world_the_end
  - hub
  unload:
    enabled: true
    blacklisted-worlds:
    - world
    - world_nether
    - world_the_end
    time-until-unload: 00:30:00
# Internal, do not change manually!
version: 5
settings:
  world-permission-whitelist: []
  spawn-teleport-message: false
  join-quit-messages: true
  save-from-death:
    enabled: true
    teleport-to-map-spawn: true
  build-mode:
    drop-items: true
    move-items: true
  builder:
    block-worldedit-non-builder: true
  update-checker: false
  scoreboard: false
  date-format: yyyy-MM-dd
  navigator:
    give-item-on-join: true
    item: COMPASS
  archive:
    vanish: true
    change-gamemode: true
    world-gamemode: SPECTATOR
folder:
  override-projects: false
  override-permissions: false
