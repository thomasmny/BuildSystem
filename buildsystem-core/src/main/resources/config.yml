# BuildSystem configuration
# Documentation: https://buildsystem.eintosti.de/getting-started/config

settings:
  update-checker: true
  scoreboard: true
  world-permission-whitelist: []
  spawn-teleport-message: false
  join-quit-messages: true
  date-format: "dd/MM/yyyy"
  archive:
    vanish: true
    change-gamemode: true
    # Options: SURVIVAL, CREATIVE, ADVENTURE, SPECTATOR
    world-gamemode: "ADVENTURE"
  save-from-death:
    enabled: true
    teleport-to-map-spawn: true
  build-mode:
    drop-items: true
    move-items: true
  builder:
    block-worldedit-non-builder: true
  navigator:
    item: "CLOCK"
    give-item-on-join: true

world:
  lock-weather: true
  invalid-characters: "^\\b$"
  import-all-delay: 30
  deletion-blacklist:
    - world
    - world_nether
    - world_the_end
  # The block placed at the spawn of newly generated void worlds. Only placed if the position is still empty.
  void-block:
    enabled: true
    material: GOLD_BLOCK
  limits:
    public: -1
    private: -1
  defaults:
    permission:
      public: "-"
      private: "worlds.%world%"
    time:
      sunrise: 0
      noon: 6000
      night: 18000
    worldborder-size: 6000000
    difficulty: "PEACEFUL"
    gamerules:
      advance_time: false
      spawn_mobs: false
      fire_damage: false
    builders-enabled:
      public: false
      private: true
    physics: true
    # Behaviors that still run while a world's physics are disabled.
    physics-exceptions:
      block-updates: false
      connections: false
      falling-blocks: false
      fluid-flow: false
      leaf-decay: false
      growth: false
      spreading: false
      block-forming: false
      block-fading: false
    explosions: true
    mob-ai: true
    block-breaking: true
    block-placement: true
    block-interactions: true
  unload:
    enabled: true
    time-until-unload: "01:00:00"
    blacklisted-worlds:
      - world
      - world_nether
      - world_the_end
  backup:
    max-backups-per-world: 5
    auto-backup:
      enabled: true
      interval: 900
      only-active-worlds: true
    storage:
      # Options: local, s3, sftp
      type: local
      s3:
        # Leave empty for Amazon S3. Set it to point at an S3-compatible service instead,
        # e.g. MinIO, Backblaze B2 or Cloudflare R2: "https://s3.example.com"
        url: null
        # Can also be supplied as AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY environment
        # variables, which take precedence and keep the secrets out of this file.
        access-key: YOUR_ACCESS_KEY
        secret-key: YOUR_SECRET_KEY
        region: eu-central-1
        bucket: buildsystem-backups
        path: backups/worlds/
      sftp:
        host: YOUR_SFTP_HOST
        port: 22
        username: YOUR_SFTP_USERNAME
        # Can also be supplied as the BUILDSYSTEM_SFTP_PASSWORD environment variable,
        # which takes precedence and keeps the secret out of this file.
        password: YOUR_SFTP_PASSWORD
        path: backups/worlds/

  # Lets players download a world as a single-player save via /worlds download.
  # Enabling this opens a port on the server that serves world archives, each
  # reachable only through an unguessable link that expires with the archive.
  download:
    enabled: false
    port: 8080
    # The address players are sent to. Change it if the port is reached through
    # a proxy or a domain, e.g. "https://downloads.example.com"
    url: "http://localhost:8080"
    expiration-minutes: 30
    # Largest single export, and the budget shared by all live downloads.
    max-size-mb: 2048
    max-storage-mb: 8192
    max-concurrent-downloads: 3

folder:
  override-permissions: true
  override-projects: false
