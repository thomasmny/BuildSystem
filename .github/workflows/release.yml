name: Attach jar to release

on:
  release:
    types: [ published ]

permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Git Repository
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: 25
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build with Gradle
        run: ./gradlew build

      # The shaded plugin jar, named BuildSystem-<version>.jar by buildsystem-core's shadowJar task.
      - name: Upload jar to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          shopt -s nullglob
          jars=(build/libs/BuildSystem-*.jar)
          if [ "${#jars[@]}" -ne 1 ]; then
            echo "Expected one plugin jar in build/libs, found: ${jars[*]}"
            exit 1
          fi
          gh release upload "$TAG" "${jars[0]}" --clobber
